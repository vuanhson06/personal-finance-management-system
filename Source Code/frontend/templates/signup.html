{% extends "base.html" %}

{% block title %}Sign Up - StayRichhh!!!{% endblock %}

{% block content %}
<canvas id="particle-canvas"></canvas>
<div class="auth-wrapper py-5">
    <div class="neu-outset auth-card text-center">
        <div class="mb-4">
            <h2 class="mb-1 text-primary-custom" style="color: var(--neu-primary);">STAYRICHHH!!!</h2>
            <p class="text-muted" style="color: var(--neu-text-secondary) !important;">Create your secure account</p>
        </div>

        <form id="signupForm" class="text-start">
            <div class="mb-4">
                <label for="username" class="form-label ms-3 text-muted">Full Name</label>
                <input type="text" class="form-control neu-inset w-100" id="username" name="username" placeholder="John Doe" required>
            </div>

            <div class="mb-4">
                <label for="email" class="form-label ms-3 text-muted">Email Address</label>
                <input type="email" class="form-control neu-inset w-100" id="email" name="email" placeholder="name@example.com" required>
            </div>
            
            <div class="mb-4">
                <label for="phone_number" class="form-label ms-3 text-muted">Phone Number</label>
                <input type="tel" class="form-control neu-inset w-100" id="phone_number" name="phone_number" placeholder="+1234567890" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label ms-3 text-muted">Password</label>
                <input type="password" class="form-control neu-inset w-100" id="password" name="password" placeholder="••••••••" required>
                <div class="form-text ms-3 mt-2" style="font-size: 0.8rem; color: var(--neu-text-secondary);">Must be at least 8 characters.</div>
            </div>

            <button type="submit" class="neu-btn-primary w-100 mb-4" id="signupBtn">
                CREATE ACCOUNT
            </button>
        </form>

        <p class="mb-0">
            Already have an account? <a href="/login" class="auth-link">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/particles.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
