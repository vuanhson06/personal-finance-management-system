<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Personal Finance{% endblock %}</title>
    
    <!-- Prevent favicon 404/500 errors -->
    <link rel="icon" href="data:,">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.0/dist/sweetalert2.min.css">
    
    <!-- Custom Neumorphic UI System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block extra_head %}{% endblock %}
</head>
<body>

    {% block content %}
    {% endblock %}

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.0/dist/sweetalert2.all.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{{ url_for('static', filename='js/profile.js') }}"></script>
    {% block extra_js %}{% endblock %}

    <!-- Security: BFCache guard + global 401 session expiry handler -->
    <script>
        // 1. BFCache Guard: If user hits "Back" after logout, force a fresh load.
        //    The browser may restore a cached page; this detects that and reloads.
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                // Page was restored from bfcache. Force a reload to re-validate session.
                window.location.reload();
            }
        });

        // 2. Global 401/403 Interceptor: Monkey-patch fetch so any API call
        //    that returns 401 or 403 (session expired/invalid) automatically
        //    redirects the user to /login without any extra per-page JS.
        (function() {
            const _originalFetch = window.fetch;
            window.fetch = async function(...args) {
                const response = await _originalFetch(...args);
                if (response.status === 401 || response.status === 403) {
                    window.location.href = '/login';
                }
                return response;
            };
        })();
    </script>
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();
    </script>
</body>
</html>
